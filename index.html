<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one calm column. Title, two books (Relationships / Targets) as page tabs, then due filters and a clean list sorted by who to contact next. Detail lives in a side panel. Deliberately light-only. */
:root{
  color-scheme:light;
  --bg:#fbfcfc; --surface:#ffffff; --soft:#f3f6f5; --line:#e6ebe9; --fg:#1d2624; --muted:#6f7c78; --faint:#9aa5a1;
  --accent:#2f7a66; --accent-soft:#e8f3ef;
  --over:#c0463a; --over-soft:#fcecea; --due:#a8700f; --due-soft:#fbf3e1; --ok:#4f7f69; --ok-soft:#eef5f1;
  --t1:#2f7a66; --t2:#5b7fa8; --t3:#8c969a;
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
header.top h1{font-size:24px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#286a58}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--soft)}
.btn.danger{color:var(--over);border-color:transparent;background:none;padding-inline:0}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* book switch: page-level tabs */
.books{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:-6px}
.book{border:0;background:none;padding:10px 0 12px;margin-bottom:-1px;cursor:pointer;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.book:hover{color:var(--fg)}
.book[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.book .due-n{font-family:var(--f-body);font-size:11px;font-weight:600;color:#fff;background:var(--over);border-radius:999px;padding:1px 7px;line-height:1.5}

.note{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}

.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(30,50,45,.08)}
.tab .c{margin-left:6px;font-size:12px;color:var(--faint)}
.tab.over-c .c{color:var(--over);font-weight:600}
.filters{display:flex;gap:8px;flex:1 1 300px;justify-content:flex-end;min-width:0}
.search{flex:1 1 200px;min-width:0;max-width:300px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;color:var(--muted)}

.list{display:grid}
.row{display:grid;gap:16px;align-items:center;padding:14px 12px;border-bottom:1px solid var(--line);border-radius:6px}
.list.rel .row{grid-template-columns:minmax(0,1.3fr) 68px 150px 128px minmax(0,1fr) 112px}
.list.tgt .row{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 150px 128px minmax(0,1fr) 112px}
.row.head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;padding-block:6px}
.row:not(.head){cursor:pointer}
.row:not(.head):hover{background:var(--soft)}
.who{min-width:0}
.name{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.name a{font-weight:500;font-size:12px;color:var(--t2);text-decoration:none}
.name a:hover{text-decoration:underline}
.sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tier::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.tier.t1{color:var(--t1)} .tier.t2{color:var(--t2)} .tier.t3{color:var(--t3)}
.when{display:grid;gap:1px}
.when .d{font-weight:500}
.when .s{font-size:12px}
.s.over{color:var(--over);font-weight:600} .s.due{color:var(--due);font-weight:600} .s.ok,.s.none{color:var(--faint)}
.clamp{min-width:0;font-size:13px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp.none{color:var(--faint)}
.row select{border:1px solid transparent;background:none;border-radius:6px;padding:4px 4px;font-size:13px;color:var(--muted);width:100%;cursor:pointer}
.row select:hover{border-color:var(--line);background:var(--surface)}
.row .btn.small{justify-self:end;white-space:nowrap}
.chip{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

@media (max-width:760px){
  .row.head{display:none}
  .list.rel .row,.list.tgt .row{grid-template-columns:1fr auto;gap:6px 12px;padding-inline:4px}
  .who,.clamp{grid-column:1/-1}
  .clamp.last{order:9}
  .row .btn.small{order:10;grid-column:1/-1;justify-self:start}
  .row select{width:auto;padding-left:0}
  .filters{justify-content:stretch}
  .search{max-width:none}
}

/* side panel */
.scrim{position:fixed;inset:0;background:rgba(29,38,36,.18);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:-8px 0 32px rgba(30,50,45,.12);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px 10px}
.sheet-head h2{font-size:19px;font-weight:700}
.sheet-body{overflow-y:auto;padding:8px 24px 28px;display:grid;gap:18px;align-content:start}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:78px;resize:vertical}
.divider{height:1px;background:var(--line)}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--muted)}
.next strong{color:var(--fg);font-weight:600}
.section-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.logadd{display:grid;grid-template-columns:140px 1fr auto;gap:8px}
.logadd input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
@media (max-width:480px){.logadd{grid-template-columns:1fr}}
.log{display:grid;gap:10px}
.log-item{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13px}
.log-item .d{color:var(--muted)}
.log-item .t{white-space:pre-wrap}
.log-item button{background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;padding:0;margin-left:6px}
.log-item button:hover{color:var(--over)}
.confirm{background:var(--over-soft);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:9px 16px;border-radius:8px;z-index:30;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(20px);opacity:.7}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Black Book</h1>
    <div class="actions">
      <button class="btn ghost" id="exportBtn" type="button">Export to Excel</button>
      <button class="btn primary" id="addBtn" type="button">Add candidate</button>
    </div>
  </header>

  <nav class="books" role="tablist" aria-label="Book">
    <button class="book" role="tab" data-book="rel" aria-selected="true" type="button">Relationships<span class="due-n num" id="dueRel" hidden></span></button>
    <button class="book" role="tab" data-book="tgt" aria-selected="false" type="button">Targets<span class="due-n num" id="dueTgt" hidden></span></button>
  </nav>

  <div class="note" id="storeNotice" hidden></div>
  <div class="note" id="exampleNotice" hidden>
    <span>Rows marked <span class="chip">Example</span> are samples.</span>
    <button id="clearExamples" type="button">Remove examples</button>
  </div>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Show">
      <button class="tab over-c" role="tab" data-filter="now" aria-selected="false" type="button">Due now<span class="c num" id="nNow"></span></button>
      <button class="tab" role="tab" data-filter="soon" aria-selected="false" type="button">Next 2 weeks<span class="c num" id="nSoon"></span></button>
      <button class="tab" role="tab" data-filter="all" aria-selected="true" type="button">Everyone<span class="c num" id="nAll"></span></button>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search" aria-label="Search">
      <select id="tierFilter" aria-label="Filter by tier">
        <option value="">All tiers</option>
        <option value="1">Tier 1</option>
        <option value="2">Tier 2</option>
        <option value="3">Tier 3</option>
      </select>
    </div>
  </div>

  <div class="list rel" id="list" role="table" aria-label="People">
    <div class="row head" role="row" id="head"></div>
    <div id="rows"><div class="empty"><strong>Loading…</strong></div></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle">Candidate</h2>
    <button class="btn ghost small" id="closeSheet" type="button">Close</button>
  </div>
  <form class="sheet-body" id="form" autocomplete="off">
    <div class="grid2">
      <div class="field"><label for="f-name">Name</label><input id="f-name" required></div>
      <div class="field" data-only="rel"><label for="f-tier">Priority</label>
        <select id="f-tier"><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option></select></div>
      <div class="field"><label for="f-company">Company</label><input id="f-company"></div>
      <div class="field" data-only="rel"><label for="f-role">Role</label><input id="f-role"></div>
      <div class="field" data-only="rel"><label for="f-manager">Manager</label><input id="f-manager"></div>
      <div class="field" data-only="tgt"><label for="f-location">Location</label><input id="f-location" placeholder="e.g. London"></div>
      <div class="field"><label for="f-linkedin">LinkedIn</label><input id="f-linkedin" type="text" inputmode="url" placeholder="linkedin.com/in/…"></div>
    </div>
    <div class="field" data-only="rel"><label for="f-situation">Their situation</label><textarea id="f-situation" placeholder="Team changes, comp, notice period, what they're weighing"></textarea></div>
    <div class="field" data-only="rel"><label for="f-levers">Reasons to reach out / levers</label><textarea id="f-levers" placeholder="Vesting cliff, promotion cycle, reorg, roles that would fit"></textarea></div>
    <div class="field" data-only="tgt"><label for="f-interest">Reason for interest</label><textarea id="f-interest" placeholder="Why they're worth pursuing: work they've shipped, team they built, roles they'd fit"></textarea></div>
    <div class="field" data-only="tgt"><label for="f-network">Network connections</label><textarea id="f-network" placeholder="Who knows them and could make an intro, shared former colleagues"></textarea></div>
    <div class="grid2">
      <div class="field"><label for="f-last" id="f-last-label">Last spoke</label><input id="f-last" type="date"></div>
      <div class="field"><label for="f-cadence">Reach out every</label><select id="f-cadence"></select></div>
    </div>
    <div class="field"><label for="f-triggers">Triggers</label><input id="f-triggers" placeholder="e.g. Vesting cliff Jan, bonus paid March, new VP starts"></div>
    <div class="next"><span>Next reach-out <strong id="f-next">—</strong></span><span id="f-status"></span></div>

    <div class="divider"></div>
    <div class="section-t" id="logTitle">Conversations</div>
    <div class="logadd">
      <input id="log-date" type="date" aria-label="Date">
      <input id="log-note" placeholder="What you talked about (optional)" aria-label="Note">
      <button class="btn small" id="log-add" type="button">Add</button>
    </div>
    <div class="log" id="log"></div>
    <div class="confirm" id="confirmDel" hidden>
      <span id="confirmText">Delete this candidate for good?</span>
      <button class="btn small" id="doDelete" type="button" style="color:var(--over)">Delete</button>
      <button class="btn small" id="cancelDelete" type="button">Keep</button>
    </div>
  </form>
  <div class="sheet-foot">
    <div class="actions">
      <button class="btn danger small" id="delBtn" type="button">Delete candidate</button>
      <button class="btn small" id="moveBtn" type="button" title="They're engaged now: move them, with their notes and history, to Relationships">Move to Relationships</button>
    </div>
    <div class="actions">
      <button class="btn" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" id="saveBtn" type="submit" form="form">Save</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const CADENCES = [1,2,3,4,5,6];
  const BOOKS = {
    rel:{coll:"contacts", ls:"crb-contacts-v1", noun:"candidate", add:"Add candidate", last:"Last spoke", logTitle:"Conversations",
         logPh:"What you talked about (optional)", quick:"Spoke today", logged:"Logged a conversation with ", sheetName:"Relationships",
         emptyAll:"No candidates yet", emptyHint:"Use “Add candidate” to start your book.",
         head:["Candidate","Tier","Next reach-out","Cadence","Triggers",""],
         search:c=>[c.name,c.company,c.role,c.manager,c.situation,c.levers,c.triggers]},
    tgt:{coll:"targets", ls:"crb-targets-v1", noun:"target", add:"Add target", last:"Last contact", logTitle:"Outreach",
         logPh:"How you reached out, any reply (optional)", quick:"Contacted today", logged:"Logged outreach to ", sheetName:"Targets",
         emptyAll:"No targets yet", emptyHint:"Use “Add target” to add someone you want to get in front of.",
         head:["Target","Reason for interest","Next reach-out","Cadence","Triggers",""],
         search:c=>[c.name,c.company,c.location,c.interest,c.network,c.triggers]}
  };
  const data = {rel:[], tgt:[]}, colls = {};
  let mode = "loading", filter = "all", editing = null, editingBook = "rel", draftLog = [];
  let book = "rel";
  try{ const b = localStorage.getItem("bb-book"); if(b==="tgt"||b==="rel") book = b; }catch(e){}

  // dates
  const pad = n => String(n).padStart(2,"0");
  const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const todayISO = () => iso(new Date());
  const parse = s => { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  function addMonths(s, n){
    const d = parse(s); if(!d) return null;
    const day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
    const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
    t.setDate(Math.min(day,last)); return iso(t);
  }
  const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
  const fmt = s => { const d=parse(s); return d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—"; };
  function status(c){
    if(!c.lastSpoke) return {key:"over", due:null, label:"Not contacted yet"};
    const due = addMonths(c.lastSpoke, Number(c.cadence)||3);
    const days = daysBetween(todayISO(), due);
    if(days < 0) return {key:"over", due, label: (-days)+" days overdue"};
    if(days === 0) return {key:"over", due, label:"Due today"};
    if(days <= 14) return {key:"due", due, label:"in "+days+" day"+(days===1?"":"s")};
    return {key:"ok", due, label:"in "+days+" days"};
  }
  const bucket = c => { const k=status(c).key; return k==="over"?"now":k==="due"?"soon":"later"; };
  function linkHref(u){ if(!u) return ""; u=u.trim(); return /^https?:\/\//i.test(u) ? u : "https://"+u; }

  // helpers
  function el(tag, attrs, ...kids){
    const e = document.createElement(tag);
    for(const k in (attrs||{})){ if(k==="class") e.className=attrs[k]; else if(k==="text") e.textContent=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
    kids.flat().forEach(k => k!=null && e.append(k.nodeType ? k : document.createTextNode(k)));
    return e;
  }
  let toastT;
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
  const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const errMsg = e => (e && (e.message||e.code)) || "try again";

  // storage
  function saveLocal(b){ try{ localStorage.setItem(BOOKS[b].ls, JSON.stringify(data[b])); }catch(e){ toast("Couldn't save in this browser. Check that site data isn't blocked."); } }
  function loadLocal(b){ try{ return JSON.parse(localStorage.getItem(BOOKS[b].ls)||"[]"); }catch(e){ return []; } }
  async function persist(c, b){
    if(mode==="db"){ const o={...c}; delete o.id; await colls[b].doc(c.id).set(o); }
    else { const L=data[b], i=L.findIndex(x=>x.id===c.id); if(i>=0) L[i]=c; else L.push(c); saveLocal(b); render(); }
  }
  async function remove(id, b){
    if(mode==="db"){ await colls[b].doc(id).delete(); }
    else { data[b] = data[b].filter(c=>c.id!==id); saveLocal(b); render(); }
  }
  function useLocal(reason){
    mode = "local"; data.rel = loadLocal("rel"); data.tgt = loadLocal("tgt");
    const n=$("#storeNotice"); n.hidden=false;
    n.textContent = reason + " For now, changes are saved in this browser only.";
    render();
  }

  // book switch
  function setBook(b){
    book = b; filter = "all"; $("#q").value = ""; $("#tierFilter").value = "";
    try{ localStorage.setItem("bb-book", b); }catch(e){}
    render();
  }

  // list
  function cadenceSelect(c, b){
    const s = el("select",{"aria-label":"Reach-out cadence for "+(c.name||BOOKS[b].noun)});
    CADENCES.forEach(m=>s.append(el("option",{value:m,text:m===1?"Every month":"Every "+m+" months"})));
    s.value = String(c.cadence||3);
    s.addEventListener("click", e=>e.stopPropagation());
    s.addEventListener("change", async e=>{ try{ await persist({...c, cadence:Number(e.target.value)}, b); toast("Cadence updated"); }catch(err){ toast("Couldn't save: "+errMsg(err)); } });
    return s;
  }
  function render(){
    const B = BOOKS[book];
    document.querySelectorAll(".book").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.book===book)));
    for(const [b,id] of [["rel","#dueRel"],["tgt","#dueTgt"]]){ const n=data[b].filter(c=>bucket(c)==="now").length; $(id).textContent=n; $(id).hidden=!n||mode==="loading"; }
    $("#addBtn").textContent = B.add;
    $("#tierFilter").hidden = book!=="rel";
    $("#list").className = "list "+book;
    $("#head").replaceChildren(...B.head.map(h=>el("span",{text:h})));
    if(mode==="loading") return;

    const all = data[book];
    const q = $("#q").value.trim().toLowerCase();
    const tf = book==="rel" ? $("#tierFilter").value : "";
    const base = all.filter(c=>{
      if(tf && String(c.tier||2)!==tf) return false;
      if(!q) return true;
      return [...B.search(c),(c.log||[]).map(l=>l.note).join(" ")].join(" ").toLowerCase().includes(q);
    });
    const nNow = base.filter(c=>bucket(c)==="now").length, nSoon = base.filter(c=>bucket(c)==="soon").length;
    $("#nNow").textContent = nNow || ""; $("#nSoon").textContent = nSoon || ""; $("#nAll").textContent = base.length || "";
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.filter===filter)));
    $("#exampleNotice").hidden = !all.some(c=>c.example);

    const list = base.filter(c=>filter==="all" || bucket(c)===filter).sort((a,b)=>{
      const da=status(a).due||"0000", dbb=status(b).due||"0000";
      if(da!==dbb) return da<dbb?-1:1;
      return (Number(a.tier)||2)-(Number(b.tier)||2) || (a.name||"").localeCompare(b.name||"");
    });
    const rows = $("#rows"); rows.replaceChildren();
    if(!all.length){ rows.append(el("div",{class:"empty"}, el("strong",{text:B.emptyAll}), B.emptyHint)); return; }
    if(!list.length){ rows.append(el("div",{class:"empty"}, el("strong",{text: filter==="now"?"You're all caught up":"No one here"}), filter==="now"?"Nobody is due for a reach-out.":"Try another filter or clear the search.")); return; }

    const b = book;
    list.forEach(c=>{
      const st = status(c);
      const li = c.linkedin ? el("a",{href:linkHref(c.linkedin), target:"_blank", rel:"noopener", text:"LinkedIn", onclick:e=>e.stopPropagation()}) : null;
      const sub = (b==="rel" ? [c.role, c.company] : [c.company, c.location]).filter(Boolean).join(b==="rel"?", ":" · ");
      const who = el("div",{class:"who"},
        el("div",{class:"name"}, c.name||"Unnamed", li, c.example?el("span",{class:"chip",text:"Example"}):null),
        el("div",{class:"sub", text: sub || " "}));
      const second = b==="rel"
        ? el("span",{class:"tier t"+(Number(c.tier)||2), text:"Tier "+(Number(c.tier)||2)})
        : el("div",{class:"clamp"+(c.interest?"":" none"), text:c.interest||"—", title:c.interest||""});
      const quick = el("button",{class:"btn small", type:"button", text:B.quick,
        onclick:async e=>{ e.stopPropagation(); const t=todayISO();
          try{ await persist({...c, lastSpoke:t, log:[{date:t,note:""}, ...(c.log||[])]}, b); toast(B.logged+c.name); }catch(err){ toast("Couldn't save: "+errMsg(err)); } }});
      rows.append(el("div",{class:"row", role:"row", tabindex:"0", onclick:()=>openSheet(c), onkeydown:e=>{ if(e.key==="Enter" && e.target===e.currentTarget) openSheet(c); }},
        who, second,
        el("div",{class:"when"}, el("span",{class:"d num",text: st.due?fmt(st.due):"—"}), el("span",{class:"s "+st.key, text:st.label})),
        cadenceSelect(c, b),
        el("div",{class:"clamp last"+(c.triggers?"":" none"), text:c.triggers||"—", title:c.triggers||""}),
        quick));
    });
  }

  // side panel
  CADENCES.forEach(m=>$("#f-cadence").append(el("option",{value:m,text:m===1?"1 month":m+" months"})));
  const FIELDS = {rel:["name","company","role","manager","linkedin","situation","levers","triggers"], tgt:["name","company","location","linkedin","interest","network","triggers"]};
  const ALL_FIELDS = ["name","company","role","manager","location","linkedin","situation","levers","interest","network","triggers"];
  function updateNext(){
    const st = status({lastSpoke:$("#f-last").value, cadence:$("#f-cadence").value});
    $("#f-next").textContent = st.due ? fmt(st.due) : "set once you log contact";
    const s=$("#f-status"); s.className="s "+st.key; s.textContent = st.due ? st.label : "";
  }
  function renderLog(){
    const L=$("#log"); L.replaceChildren();
    const items = draftLog.slice().sort((a,b)=>a.date<b.date?1:-1);
    if(!items.length){ L.append(el("div",{class:"log-item"}, el("span",{class:"d",text:"None yet"}))); return; }
    items.forEach(it=>L.append(el("div",{class:"log-item"},
      el("span",{class:"d num",text:fmt(it.date)}),
      el("span",{}, el("span",{class:"t",text:it.note||(editingBook==="rel"?"Spoke":"Reached out")}), el("button",{type:"button",text:"Remove","aria-label":"Remove this entry",onclick:()=>{ draftLog=draftLog.filter(x=>x!==it); renderLog(); }})))));
  }
  function openSheet(c){
    editingBook = book; const B = BOOKS[book];
    editing = c ? {...c} : {id:uid(), cadence:3, log:[], ...(book==="rel"?{tier:2}:{})};
    draftLog = (editing.log||[]).map(x=>({...x}));
    document.querySelectorAll("[data-only]").forEach(x=>x.hidden = x.dataset.only!==book);
    $("#sheetTitle").textContent = c ? (c.name||B.noun) : B.add;
    ALL_FIELDS.forEach(f=>$("#f-"+f).value = editing[f]||"");
    $("#f-last").value = editing.lastSpoke||"";
    $("#f-tier").value=String(editing.tier||2); $("#f-cadence").value=String(editing.cadence||3);
    $("#f-last-label").textContent = B.last; $("#logTitle").textContent = B.logTitle; $("#log-note").placeholder = B.logPh;
    $("#delBtn").textContent = "Delete "+B.noun; $("#confirmText").textContent = "Delete this "+B.noun+" for good?";
    $("#log-date").value=todayISO(); $("#log-note").value="";
    $("#delBtn").hidden = !c; $("#confirmDel").hidden = true;
    $("#moveBtn").hidden = !(c && book==="tgt");
    updateNext(); renderLog();
    $("#scrim").hidden=false; $("#sheet").hidden=false;
    setTimeout(()=>$("#f-name").focus(), 30);
  }
  function closeSheet(){ $("#scrim").hidden=true; $("#sheet").hidden=true; editing=null; }

  $("#log-add").addEventListener("click", ()=>{
    const d=$("#log-date").value; if(!d){ toast("Pick a date"); return; }
    draftLog.push({date:d, note:$("#log-note").value.trim()});
    if(!$("#f-last").value || d > $("#f-last").value) $("#f-last").value = d;
    $("#log-note").value=""; renderLog(); updateNext();
  });
  $("#f-last").addEventListener("change", updateNext);
  $("#f-cadence").addEventListener("change", updateNext);
  $("#form").addEventListener("submit", async e=>{
    e.preventDefault();
    const name=$("#f-name").value.trim(); if(!name){ $("#f-name").focus(); return; }
    const b = editingBook, c = {...editing};
    FIELDS[b].forEach(f=>c[f]=$("#f-"+f).value.trim());
    if(b==="rel") c.tier = Number($("#f-tier").value);
    Object.assign(c, {lastSpoke:$("#f-last").value||"", cadence:Number($("#f-cadence").value), log:draftLog, updatedAt:new Date().toISOString()});
    if(!c.createdAt) c.createdAt = c.updatedAt;
    $("#saveBtn").disabled=true;
    try{ await persist(c, b); toast("Saved"); closeSheet(); }
    catch(err){ toast("Couldn't save: "+errMsg(err)); }
    finally{ $("#saveBtn").disabled=false; }
  });
  // Move a target to Relationships, carrying details and history; uses what's in the form now
  $("#moveBtn").addEventListener("click", async ()=>{
    const v = id=>$(id).value.trim();
    const name = v("#f-name"); if(!name){ $("#f-name").focus(); return; }
    const loc = v("#f-location"), net = v("#f-network"), now = new Date().toISOString();
    const rel = { id:uid(), name, company:v("#f-company"), role:"", manager:"", linkedin:v("#f-linkedin"), tier:2,
      situation:[loc?"Based in "+loc+".":"", net?"Network: "+net:""].filter(Boolean).join("\n"),
      levers:v("#f-interest"), triggers:v("#f-triggers"),
      lastSpoke:$("#f-last").value||"", cadence:Number($("#f-cadence").value), log:draftLog,
      createdAt:editing.createdAt||now, updatedAt:now };
    const fromId = editing.id;
    $("#moveBtn").disabled = true;
    try{
      await persist(rel, "rel");
      await remove(fromId, "tgt");
      closeSheet(); setBook("rel"); openSheet(rel);
      toast("Moved "+name+" to Relationships. Add their role and manager.");
    }catch(err){ toast("Couldn't move: "+errMsg(err)); }
    finally{ $("#moveBtn").disabled = false; }
  });
  $("#delBtn").addEventListener("click", ()=>{ $("#confirmDel").hidden=false; $("#confirmDel").scrollIntoView({block:"nearest"}); });
  $("#cancelDelete").addEventListener("click", ()=>$("#confirmDel").hidden=true);
  $("#doDelete").addEventListener("click", async ()=>{ try{ await remove(editing.id, editingBook); toast("Deleted"); closeSheet(); }catch(err){ toast("Couldn't delete: "+errMsg(err)); } });
  $("#closeSheet").addEventListener("click", closeSheet);
  $("#cancelBtn").addEventListener("click", closeSheet);
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });

  // toolbar
  $("#addBtn").addEventListener("click", ()=>openSheet(null));
  $("#q").addEventListener("input", render);
  $("#tierFilter").addEventListener("change", render);
  document.querySelectorAll(".book").forEach(x=>x.addEventListener("click", ()=>{ if(x.dataset.book!==book) setBook(x.dataset.book); }));
  document.querySelectorAll(".tab").forEach(x=>x.addEventListener("click", ()=>{ filter=x.dataset.filter; render(); }));
  $("#clearExamples").addEventListener("click", async ()=>{
    const b = book, ex = data[b].filter(c=>c.example);
    try{ for(const c of ex) await remove(c.id, b); toast("Examples removed"); }catch(err){ toast("Couldn't remove: "+errMsg(err)); }
  });

  // Excel export: one workbook, a sheet per book
  function logText(c){ return (c.log||[]).slice().sort((a,b)=>a.date<b.date?1:-1).map(l=>l.date+(l.note?" – "+l.note:"")).join("\n"); }
  const byDue = (a,b)=>((status(a).due||"0")<(status(b).due||"0")?-1:1);
  $("#exportBtn").addEventListener("click", async ()=>{
    if(typeof XLSX==="undefined"){ toast("The Excel library didn't load. Reload the page and try again."); return; }
    const relRows = data.rel.slice().sort((a,b)=>(Number(a.tier)||2)-(Number(b.tier)||2) || byDue(a,b)).map(c=>{ const st=status(c); return {
      "Name":c.name||"", "Tier":"Tier "+(Number(c.tier)||2), "Company":c.company||"", "Role":c.role||"", "Manager":c.manager||"",
      "LinkedIn":c.linkedin?linkHref(c.linkedin):"", "Situation":c.situation||"", "Reasons to reach out / levers":c.levers||"",
      "Last spoke":c.lastSpoke?parse(c.lastSpoke):"", "Cadence (months)":Number(c.cadence)||"", "Triggers":c.triggers||"",
      "Next reach-out":st.due?parse(st.due):"", "Status":st.label, "Conversation log":logText(c) };});
    const tgtRows = data.tgt.slice().sort(byDue).map(c=>{ const st=status(c); return {
      "Name":c.name||"", "Company":c.company||"", "Location":c.location||"", "LinkedIn":c.linkedin?linkHref(c.linkedin):"",
      "Reason for interest":c.interest||"", "Network connections":c.network||"", "Triggers":c.triggers||"",
      "Last contact":c.lastSpoke?parse(c.lastSpoke):"", "Cadence (months)":Number(c.cadence)||"",
      "Next reach-out":st.due?parse(st.due):"", "Status":st.label, "Outreach log":logText(c) };});
    const sheet = (rows, headers, widths) => {
      const ws = XLSX.utils.json_to_sheet(rows, {header:headers, cellDates:true, dateNF:"dd mmm yyyy"});
      ws["!cols"] = widths.map(w=>({wch:w}));
      if(rows.length) ws["!autofilter"] = {ref: ws["!ref"]};
      return ws;
    };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet(relRows,
      ["Name","Tier","Company","Role","Manager","LinkedIn","Situation","Reasons to reach out / levers","Last spoke","Cadence (months)","Triggers","Next reach-out","Status","Conversation log"],
      [22,8,22,24,20,34,48,48,14,10,36,14,18,60]), "Relationships");
    XLSX.utils.book_append_sheet(wb, sheet(tgtRows,
      ["Name","Company","Location","LinkedIn","Reason for interest","Network connections","Triggers","Last contact","Cadence (months)","Next reach-out","Status","Outreach log"],
      [22,22,16,34,48,40,36,14,10,14,18,60]), "Targets");
    const buf = XLSX.write(wb, {bookType:"xlsx", type:"array", cellDates:true});
    const filename = "black-book-"+todayISO()+".xlsx";
    const done = "Exported "+relRows.length+" relationships and "+tgtRows.length+" targets";
    const url = URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(done);
  });

  mode = "local"; data.rel = loadLocal("rel"); data.tgt = loadLocal("tgt"); render();
})();
</script>

</body>
</html>
